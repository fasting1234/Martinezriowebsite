<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERCOR COLLEGE</title>
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0f172a;color:#fff;padding:10px}
.top{background:#fff;color:#000;padding:12px;border-radius:15px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top img{width:60px;height:60px;border-radius:50%;border:3px solid #facc15}
.box{background:#fff;color:#000;border-radius:15px;padding:14px;margin:10px 0}
input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:2px solid #ddd}
button{border:none;font-weight:900;background:#0f172a;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th{background:#0f172a;color:#fff;padding:8px;text-align:left}
td{padding:8px;border-bottom:1px solid #eee;color:#000}
</style>
</head>
<body>

<div class="top">
   <div style="width:60px;height:60px;background:#0f172a;color:#facc15;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:3px solid #facc15">HC</div>
<div><b>HERCOR COLLEGE</b><br><small>RIO P. MARTINEZ - Cum Laude</small></div>
</div>

<div class="box">
<h3>ADD EMPLOYER</h3>
<input id="eName" placeholder="Name">
<input id="eSalary" type="number" placeholder="Salary 50000">
<button onclick="addEmp()">ADD EMPLOYER</button>
<table id="eTable"></table>
</div>

<div class="box">
<h3>PAYROLL</h3>
<select id="pEmp"></select>
<input id="pDays" type="number" placeholder="Days 22">
<button onclick="addPay()">GENERATE PAYSLIP</button>
<table id="pTable"></table>
</div>

<div class="box" style="background:#ef4444;color:#fff">
<button onclick="clearData()" style="background:#fff;color:#000">CLICK DITO PAG BLANKO PA RIN - RESET</button>
</div>

<script>
var DB = JSON.parse(localStorage.getItem('HERCOR_FIX') || '{"employees":[{"name":"RIO P. MARTINEZ","salary":50000}],"payrolls":[]}');
function save(){localStorage.setItem('HERCOR_FIX',JSON.stringify(DB));show();}
function addEmp(){var n=document.getElementById('eName').value;var s=document.getElementById('eSalary').value;if(!n){alert('Lagay name');return}DB.employees.push({name:n,salary:Number(s)||0});document.getElementById('eName').value='';save()}
function addPay(){var i=document.getElementById('pEmp').value;if(i===''){alert('Pili employer');return}var emp=DB.employees[i];var d=document.getElementById('pDays').value||22;var net=emp.salary/22*d;DB.payrolls.push({name:emp.name,net:net});save()}
function clearData(){if(confirm('Burahin lahat?')){localStorage.clear();location.reload()}}
function show(){
 var h='<tr><th>Name</th><th>Salary</th><th>X</th></tr>';
 for(var i=0;i<DB.employees.length;i++){h+='<tr><td>'+DB.employees[i].name+'</td><td>₱'+DB.employees[i].salary+'</td><td><button onclick="DB.employees.splice('+i+',1);save()" style="width:auto;background:red;padding:5px">X</button></td></tr>'}
 document.getElementById('eTable').innerHTML=h;
 var o='<option value="">Pili Employer</option>';
 for(var j=0;j<DB.employees.length;j++){o+='<option value="'+j+'">'+DB.employees[j].name+'</option>'}
 document.getElementById('pEmp').innerHTML=o;
 var p='<tr><th>Name</th><th>Net</th><th>X</th></tr>';
 for(var k=0;k<DB.payrolls.length;k++){p+='<tr><td>'+DB.payrolls[k].name+'</td><td>₱'+DB.payrolls[k].net+'</td><td><button onclick="DB.payrolls.splice('+k+',1);save()" style="width:auto;background:red;padding:5px">X</button></td></tr>'}
 document.getElementById('pTable').innerHTML=p;
}
show();
</script>
</body>
</html>
